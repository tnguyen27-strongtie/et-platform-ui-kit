name: Release

# Push a tag that matches package.json ("git tag v0.6.0 && git push origin v0.6.0").
# The full CI runs first; the release then carries the exact tarball CI built and checked.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.ci.outputs.artifact }}
          path: pack
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [[ ! -s notes.md ]]; then
            echo "::error::CHANGELOG.md has no section for [${VERSION}]"
            exit 1
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          [[ "$VERSION" == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" pack/*.tgz \
            --title "@platform/ui ${VERSION}" \
            --notes-file notes.md \
            --verify-tag "${prerelease[@]}"
